name: CROWNFALL 2.0 Verify

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/crownfall-2.0-verify.yml"

jobs:
  verify-crown-momentum:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 toolchain
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate 2.0 gameplay and build UX
        shell: bash
        run: |
          set -euo pipefail
          F="CROWNFALL_Stronghold_Android/app/src/main/assets/www/index.html"
          grep -q "buildGhost" "$F"
          grep -q "updateBuildGhost" "$F"
          grep -q "crownMomentum" "$F"
          grep -q "royalRush" "$F"
          grep -q "addMomentum" "$F"
          grep -q "rushProdBonus" "$F"
          grep -q "rushRewardBonus" "$F"
          grep -q "دفعة التاج" "$F"
          grep -q "الإصدار 2.0" "$F"
          grep -q 'versionName = "2.0.0"' CROWNFALL_Stronghold_Android/app/build.gradle.kts
          grep -q "versionCode = 200" CROWNFALL_Stronghold_Android/app/build.gradle.kts

      - name: Check gameplay JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("CROWNFALL_Stronghold_Android/app/src/main/assets/www/index.html")
          t=p.read_text(encoding="utf-8")
          m=re.search(r"<script>(.*)</script>", t, re.S)
          assert m, "script block missing"
          js=m.group(1)
          for marker in [
              "function updateBuildGhost",
              "function addMomentum",
              "function consumeRush",
              "function renderDistrictLinks",
              "function combatTurn"
          ]:
              assert marker in js, marker
          Path("/tmp/crownfall-game.js").write_text(js, encoding="utf-8")
          PY
          node --check /tmp/crownfall-game.js

      - name: Build release bundle
        working-directory: CROWNFALL_Stronghold_Android
        run: gradle :app:bundleRelease --stacktrace

      - name: Verify AAB exists
        shell: bash
        run: |
          test -s CROWNFALL_Stronghold_Android/app/build/outputs/bundle/release/app-release.aab
          unzip -t CROWNFALL_Stronghold_Android/app/build/outputs/bundle/release/app-release.aab >/dev/null

      - name: Upload verified AAB
        uses: actions/upload-artifact@v4
        with:
          name: CROWNFALL-2.0.0-CrownMomentum-Verified-AAB
          path: CROWNFALL_Stronghold_Android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
