name: CROWNFALL 2.1 Runtime Hotfix Verify

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/crownfall-2.1-runtime-hotfix-verify.yml"
      - "CROWNFALL_Stronghold_Android/app/src/main/java/com/crownfall/stronghold/MainActivity.java"

jobs:
  verify-runtime-hotfix:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 toolchain
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate startup crash fix
        shell: bash
        run: |
          set -euo pipefail
          J="CROWNFALL_Stronghold_Android/app/src/main/java/com/crownfall/stronghold/MainActivity.java"
          grep -q "decor.getWindowInsetsController()" "$J"
          grep -q "webView.post(this::immersive)" "$J"
          grep -q "CROWNFALL_SMOKE" "$J"
          ! grep -q "getWindow().getInsetsController()" "$J"
          grep -q 'versionName = "2.1.0"' CROWNFALL_Stronghold_Android/app/build.gradle.kts
          grep -q "versionCode = 210" CROWNFALL_Stronghold_Android/app/build.gradle.kts

      - name: Build release bundle after runtime fix
        working-directory: CROWNFALL_Stronghold_Android
        run: gradle :app:bundleRelease --stacktrace

      - name: Verify AAB
        shell: bash
        run: |
          AAB="CROWNFALL_Stronghold_Android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          sha256sum "$AAB"

      - name: Upload fixed AAB
        uses: actions/upload-artifact@v4
        with:
          name: CROWNFALL-2.1.0-RuntimeFixed-AAB
          path: CROWNFALL_Stronghold_Android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
