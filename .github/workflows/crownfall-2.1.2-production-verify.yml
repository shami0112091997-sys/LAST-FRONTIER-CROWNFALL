name: CROWNFALL 2.1.2 Production Verify

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/crownfall-2.1.2-production-verify.yml"

jobs:
  verify-production:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 toolchain
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate production identity and privacy
        shell: bash
        run: |
          set -euo pipefail
          H="CROWNFALL_Stronghold_Android/app/src/main/assets/www/index.html"
          G="CROWNFALL_Stronghold_Android/app/build.gradle.kts"
          M="CROWNFALL_Stronghold_Android/app/src/main/AndroidManifest.xml"
          grep -q 'applicationId = "com.crownfall.stronghold"' "$G"
          grep -q 'versionName = "2.1.2"' "$G"
          grep -q 'versionCode = 212' "$G"
          grep -q 'targetSdk = 36' "$G"
          grep -q 'android:testOnly="false"' "$M"
          ! grep -q '<uses-permission android:name="android.permission.INTERNET"' "$M"
          grep -q "سياسة الخصوصية" "$H"
          grep -q "لا تجمع اللعبة أو ترسل أو تشارك بيانات شخصية" "$H"
          ! grep -Eqi "Phone Test|debugphone|phonepreview|CROWNFALL TEST|Android Preview" "$H"

      - name: Check gameplay JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path("CROWNFALL_Stronghold_Android/app/src/main/assets/www/index.html").read_text(encoding="utf-8")
          m=re.search(r"<script>(.*)</script>", t, re.S)
          assert m, "script block missing"
          Path("/tmp/crownfall-production.js").write_text(m.group(1), encoding="utf-8")
          PY
          node --check /tmp/crownfall-production.js

      - name: Build production AAB
        working-directory: CROWNFALL_Stronghold_Android
        run: gradle :app:bundleRelease --stacktrace

      - name: Verify AAB integrity
        shell: bash
        run: |
          AAB="CROWNFALL_Stronghold_Android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          sha256sum "$AAB"

      - name: Upload verified production AAB
        uses: actions/upload-artifact@v4
        with:
          name: CROWNFALL-2.1.2-Production-Verified-AAB
          path: CROWNFALL_Stronghold_Android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
