name: LEGACY CROWNFALL WebView 214 - NOT Unreal Stronghold 218

on:
  workflow_dispatch:

jobs:
  google-play-release:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 toolchain
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate production game asset
        shell: bash
        run: |
          set -euo pipefail
          TARGET="CROWNFALL_Stronghold_Android/app/src/main/assets/www/index.html"
          test -s "$TARGET"
          grep -q "CROWNFALL: STRONGHOLD" "$TARGET"
          grep -q "الإصدار 2.1.2" "$TARGET"
          grep -q "crownfall_v100_android" "$TARGET"
          if grep -Eq "CROWNFALL TEST|Android Preview|preview023|crownfall_v023_android" "$TARGET"; then
            echo "Preview/test marker found in production game asset."
            exit 1
          fi
          UNEXPECTED_URLS=$(grep -Eoi 'https?://[^"[:space:]<>)]+' "$TARGET" | grep -Fv 'http://www.w3.org/2000/svg' || true)
          if [ -n "$UNEXPECTED_URLS" ] || grep -Eqi "firebase|analytics|adsbygoogle|websocket" "$TARGET"; then
            echo "Unexpected network/analytics marker found in offline production asset."
            if [ -n "$UNEXPECTED_URLS" ]; then
              echo "$UNEXPECTED_URLS"
            fi
            exit 1
          fi
          echo "Production game asset validated: $(wc -c < "$TARGET") bytes"

      # This legacy workflow builds the WebView 214 application, NOT Unreal 218.
      # Keep signing secrets in the build step only; never persist passwords to
      # GITHUB_ENV for every later step.
      - name: Build LEGACY WebView AAB with step-scoped signing
        working-directory: CROWNFALL_Stronghold_Android
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.CROWNFALL_UPLOAD_KEYSTORE_B64 }}
          CROWNFALL_KEYSTORE_PASSWORD: ${{ secrets.CROWNFALL_UPLOAD_STORE_PASSWORD }}
          CROWNFALL_KEY_ALIAS: ${{ secrets.CROWNFALL_UPLOAD_KEY_ALIAS }}
          CROWNFALL_KEY_PASSWORD: ${{ secrets.CROWNFALL_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_B64"
          test -n "$CROWNFALL_KEYSTORE_PASSWORD"
          test -n "$CROWNFALL_KEY_ALIAS"
          test -n "$CROWNFALL_KEY_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/crownfall-upload.jks"
          trap 'rm -f -- "$KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          export CROWNFALL_KEYSTORE_FILE="$KEYSTORE"
          gradle :app:bundleRelease --stacktrace

      - name: Verify Google Play bundle
        shell: bash
        run: |
          set -euo pipefail
          SRC="CROWNFALL_Stronghold_Android/app/build/outputs/bundle/release/app-release.aab"
          FINAL="$GITHUB_WORKSPACE/CROWNFALL_Stronghold_2.1.2_GooglePlay.aab"
          test -f "$SRC"
          cp "$SRC" "$FINAL"
          jarsigner -verify -verbose -certs "$FINAL" > CROWNFALL_2.1.2_AAB_Signature_Report.txt
          grep -q "jar verified" CROWNFALL_2.1.2_AAB_Signature_Report.txt
          unzip -t "$FINAL" > CROWNFALL_2.1.2_AAB_Zip_Test.txt
          sha256sum "$FINAL" > CROWNFALL_2.1.2_AAB_SHA256.txt
          echo "CROWNFALL Google Play AAB verified."

      - name: Upload Google Play production bundle
        uses: actions/upload-artifact@v4
        with:
          name: CROWNFALL-Stronghold-2.1.2-GooglePlay
          path: |
            CROWNFALL_Stronghold_2.1.2_GooglePlay.aab
            CROWNFALL_2.1.2_AAB_Signature_Report.txt
            CROWNFALL_2.1.2_AAB_Zip_Test.txt
            CROWNFALL_2.1.2_AAB_SHA256.txt
          if-no-files-found: error
