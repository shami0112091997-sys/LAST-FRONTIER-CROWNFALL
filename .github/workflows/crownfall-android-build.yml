name: CROWNFALL Android Build

on:
  workflow_dispatch:
  push:
    branches: [ "crownfall-v0.8-android" ]
    paths:
      - "CROWNFALL_Stronghold_Android/**"
      - ".github/workflows/crownfall-android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK and release AAB
        working-directory: CROWNFALL_Stronghold_Android
        run: |
          gradle :app:assembleDebug :app:bundleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CROWNFALL-Stronghold-v0.8-debug-apk
          path: CROWNFALL_Stronghold_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: CROWNFALL-Stronghold-v0.8-release-aab-unsigned
          path: CROWNFALL_Stronghold_Android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
