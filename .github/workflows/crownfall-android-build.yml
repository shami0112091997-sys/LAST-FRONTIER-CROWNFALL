name: CROWNFALL Android Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "CROWNFALL_Stronghold_Android/**"
      - ".github/workflows/crownfall-android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build v0.11 preview APK
        working-directory: CROWNFALL_Stronghold_Android
        run: gradle :app:assemblePreview --stacktrace

      - name: Verify v0.11 preview APK
        shell: bash
        run: |
          APK="CROWNFALL_Stronghold_Android/app/build/outputs/apk/preview/app-preview.apk"
          test -f "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee CROWNFALL_v0.11_APK_Signature_Report.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee CROWNFALL_v0.11_APK_Badging.txt
          grep -q "package: name='com.crownfall.stronghold.preview011'" CROWNFALL_v0.11_APK_Badging.txt
          grep -q "application-label:'CROWNFALL TEST 0.11'" CROWNFALL_v0.11_APK_Badging.txt

      - name: Upload v0.11 preview APK
        uses: actions/upload-artifact@v4
        with:
          name: CROWNFALL-Stronghold-v0.11-preview-apk
          path: |
            CROWNFALL_Stronghold_Android/app/build/outputs/apk/preview/app-preview.apk
            CROWNFALL_v0.11_APK_Signature_Report.txt
            CROWNFALL_v0.11_APK_Badging.txt
          if-no-files-found: error
