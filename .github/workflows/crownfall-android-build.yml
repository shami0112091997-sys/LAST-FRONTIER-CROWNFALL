name: CROWNFALL Google Play Release

on:
  workflow_dispatch:

jobs:
  google-play-release:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 toolchain
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble production web assets
        shell: bash
        run: |
          set -euo pipefail
          PARTS="CROWNFALL_Stronghold_Android/app/src/main/assets/google_play_parts"
          TARGET="CROWNFALL_Stronghold_Android/app/src/main/assets/www/index.html"
          test -d "$PARTS"
          cat "$PARTS"/part*.txt > "$TARGET"
          grep -q "CROWNFALL: STRONGHOLD" "$TARGET"
          grep -q "v1.0" "$TARGET"
          echo "Production web asset bytes: $(wc -c < "$TARGET")"

      - name: Require Google Play upload-key secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.CROWNFALL_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.CROWNFALL_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CROWNFALL_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CROWNFALL_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/crownfall-upload.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          echo "CROWNFALL_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "CROWNFALL_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "CROWNFALL_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "CROWNFALL_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build Google Play AAB
        working-directory: CROWNFALL_Stronghold_Android
        run: gradle :app:bundleRelease --stacktrace

      - name: Verify Google Play bundle
        shell: bash
        run: |
          set -euo pipefail
          SRC="CROWNFALL_Stronghold_Android/app/build/outputs/bundle/release/app-release.aab"
          FINAL="$GITHUB_WORKSPACE/CROWNFALL_Stronghold_1.0.0_GooglePlay.aab"
          test -f "$SRC"
          cp "$SRC" "$FINAL"
          jarsigner -verify -verbose -certs "$FINAL" > CROWNFALL_1.0.0_AAB_Signature_Report.txt
          grep -q "jar verified" CROWNFALL_1.0.0_AAB_Signature_Report.txt
          unzip -t "$FINAL" > CROWNFALL_1.0.0_AAB_Zip_Test.txt
          sha256sum "$FINAL" > CROWNFALL_1.0.0_AAB_SHA256.txt
          echo "CROWNFALL Google Play AAB verified."

      - name: Upload Google Play production bundle
        uses: actions/upload-artifact@v4
        with:
          name: CROWNFALL-Stronghold-1.0.0-GooglePlay
          path: |
            CROWNFALL_Stronghold_1.0.0_GooglePlay.aab
            CROWNFALL_1.0.0_AAB_Signature_Report.txt
            CROWNFALL_1.0.0_AAB_Zip_Test.txt
            CROWNFALL_1.0.0_AAB_SHA256.txt
          if-no-files-found: error
