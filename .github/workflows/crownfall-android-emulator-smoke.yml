name: CROWNFALL Android Emulator Smoke

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/crownfall-android-emulator-smoke.yml"

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android toolchain
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug and release APKs
        working-directory: CROWNFALL_Stronghold_Android
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and smoke test game
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            APK="CROWNFALL_Stronghold_Android/app/build/outputs/apk/debug/app-debug.apk"
            test -s "$APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.crownfall.stronghold
            adb shell monkey -p com.crownfall.stronghold -c android.intent.category.LAUNCHER 1
            sleep 10
            adb shell pidof com.crownfall.stronghold | tee /tmp/crownfall_pid.txt
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | tee /tmp/crownfall_activity.txt || true
            adb exec-out screencap -p > /tmp/crownfall_screen.png
            adb logcat -d > /tmp/crownfall_logcat.txt
            if grep -E "FATAL EXCEPTION|AndroidRuntime.*FATAL|ANR in com\.crownfall\.stronghold" /tmp/crownfall_logcat.txt; then
              echo "CROWNFALL_RUNTIME_FAILURE"
              exit 1
            fi
            grep -q "com.crownfall.stronghold" /tmp/crownfall_pid.txt
            echo "CROWNFALL_EMULATOR_SMOKE_PASS"

      - name: Collect smoke-test evidence
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/crownfall-smoke
          cp CROWNFALL_Stronghold_Android/app/build/outputs/apk/debug/app-debug.apk /tmp/crownfall-smoke/CROWNFALL-2.1.0-debug.apk || true
          cp CROWNFALL_Stronghold_Android/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/crownfall-smoke/CROWNFALL-2.1.0-release-unsigned.apk || true
          cp /tmp/crownfall_screen.png /tmp/crownfall-smoke/ || true
          cp /tmp/crownfall_logcat.txt /tmp/crownfall-smoke/ || true
          cp /tmp/crownfall_activity.txt /tmp/crownfall-smoke/ || true
          cp /tmp/crownfall_pid.txt /tmp/crownfall-smoke/ || true

      - name: Upload smoke-test package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CROWNFALL-2.1.0-Android-Smoke
          path: /tmp/crownfall-smoke
          if-no-files-found: error
