name: CROWNFALL Campaign Verify

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/crownfall-campaign-verify.yml"

jobs:
  verify-campaign-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 toolchain
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate 1.6 campaign gameplay
        shell: bash
        run: |
          set -euo pipefail
          F="CROWNFALL_Stronghold_Android/app/src/main/assets/www/index.html"
          grep -q "openCampaign" "$F"
          grep -q "startCampaign" "$F"
          grep -q "CAMPAIGN" "$F"
          grep -q "ROUTES" "$F"
          grep -q "campaignEnemy" "$F"
          grep -q "completeCampaignStage" "$F"
          grep -q "ضباب الحديد" "$F"
          grep -q "سكة التاج السوداء" "$F"
          grep -q "حصار برج الأثير" "$F"
          grep -q "هجوم جريء" "$F"
          grep -q "تحصين" "$F"
          grep -q "نهب الموارد" "$F"
          grep -q "الإصدار 1.6" "$F"
          grep -q 'versionName = "1.6.0"' CROWNFALL_Stronghold_Android/app/build.gradle.kts
          grep -q "versionCode = 106" CROWNFALL_Stronghold_Android/app/build.gradle.kts

      - name: Check gameplay JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("CROWNFALL_Stronghold_Android/app/src/main/assets/www/index.html")
          t=p.read_text(encoding="utf-8")
          m=re.search(r"<script>(.*)</script>", t, re.S)
          assert m, "script block missing"
          js=m.group(1)
          for marker in ["function openCampaign","function startCampaign","function campaignEnemy","function combatTurn"]:
              assert marker in js, marker
          Path("/tmp/crownfall-game.js").write_text(js, encoding="utf-8")
          PY
          node --check /tmp/crownfall-game.js

      - name: Build release bundle
        working-directory: CROWNFALL_Stronghold_Android
        run: gradle :app:bundleRelease --stacktrace

      - name: Verify AAB exists
        shell: bash
        run: |
          test -s CROWNFALL_Stronghold_Android/app/build/outputs/bundle/release/app-release.aab
          unzip -t CROWNFALL_Stronghold_Android/app/build/outputs/bundle/release/app-release.aab >/dev/null

      - name: Upload verified AAB
        uses: actions/upload-artifact@v4
        with:
          name: CROWNFALL-1.6.0-Campaign-Verified-AAB
          path: CROWNFALL_Stronghold_Android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
