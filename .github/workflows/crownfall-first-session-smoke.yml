name: CROWNFALL First Session Smoke

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/crownfall-first-session-smoke.yml"
      - "CROWNFALL_Stronghold_Android/gameplay_smoke.sh"
      - "CROWNFALL_Stronghold_Android/app/src/main/java/com/crownfall/stronghold/MainActivity.java"

jobs:
  first-session:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android toolchain
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        working-directory: CROWNFALL_Stronghold_Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run first-session gameplay smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          disable-animations: true
          script: bash CROWNFALL_Stronghold_Android/gameplay_smoke.sh

      - name: Collect gameplay evidence
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/crownfall-first-session
          cp CROWNFALL_Stronghold_Android/app/build/outputs/apk/debug/app-debug.apk /tmp/crownfall-first-session/CROWNFALL-2.1.0-debug.apk || true
          cp /tmp/crownfall_gameplay.png /tmp/crownfall-first-session/ || true
          cp /tmp/crownfall_gameplay_logcat.txt /tmp/crownfall-first-session/ || true
          cp /tmp/crownfall_start.txt /tmp/crownfall-first-session/ || true
          cp /tmp/crownfall_pid.txt /tmp/crownfall-first-session/ || true

      - name: Upload gameplay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CROWNFALL-2.1.0-FirstSession-Smoke
          path: /tmp/crownfall-first-session
          if-no-files-found: error
