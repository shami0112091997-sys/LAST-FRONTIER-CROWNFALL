name: CROWNFALL Gameplay Verify

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/crownfall-gameplay-verify.yml"

jobs:
  verify-gameplay-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android 16 toolchain
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Validate gameplay markers
        shell: bash
        run: |
          set -euo pipefail
          F="CROWNFALL_Stronghold_Android/app/src/main/assets/www/index.html"
          grep -q "openBattle" "$F"
          grep -q "combatTurn" "$F"
          grep -q "addXp" "$F"
          grep -q "bestStreak" "$F"
          grep -q "صندوق سلسلة الانتصارات" "$F"
      - name: Build release bundle
        working-directory: CROWNFALL_Stronghold_Android
        run: gradle :app:bundleRelease --stacktrace
      - name: Verify AAB exists
        shell: bash
        run: |
          test -s CROWNFALL_Stronghold_Android/app/build/outputs/bundle/release/app-release.aab
          unzip -t CROWNFALL_Stronghold_Android/app/build/outputs/bundle/release/app-release.aab >/dev/null

      - name: Upload verified AAB
        uses: actions/upload-artifact@v4
        with:
          name: CROWNFALL-Gameplay-Verified-AAB
          path: CROWNFALL_Stronghold_Android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
