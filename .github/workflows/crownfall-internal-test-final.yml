name: CROWNFALL Internal Test Final

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/crownfall-internal-test-final.yml"

jobs:
  build-internal-test:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 toolchain
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Deep production preflight
        shell: bash
        run: |
          set -euo pipefail
          G="CROWNFALL_Stronghold_Android/app/build.gradle.kts"
          M="CROWNFALL_Stronghold_Android/app/src/main/AndroidManifest.xml"
          J="CROWNFALL_Stronghold_Android/app/src/main/java/com/crownfall/stronghold/MainActivity.java"
          H="CROWNFALL_Stronghold_Android/app/src/main/assets/www/index.html"

          grep -q 'namespace = "com.crownfall.stronghold"' "$G"
          grep -q 'applicationId = "com.crownfall.stronghold"' "$G"
          grep -q 'versionCode = 212' "$G"
          grep -q 'versionName = "2.1.2"' "$G"
          grep -q 'compileSdk = 36' "$G"
          grep -q 'targetSdk = 36' "$G"
          grep -q 'minSdk = 23' "$G"
          grep -q 'android:testOnly="false"' "$M"
          grep -q 'android:screenOrientation="landscape"' "$M"
          ! grep -q 'android.permission.INTERNET' "$M"
          grep -q 'file:///android_asset/www/index.html' "$J"
          grep -q 'decor.getWindowInsetsController()' "$J"
          grep -q 'webView.post(this::immersive)' "$J"
          grep -q 'CROWNFALL: STRONGHOLD' "$H"
          grep -q 'الإصدار 2.1.2' "$H"
          grep -q 'سياسة الخصوصية' "$H"
          grep -q 'crownfall_v100_android' "$H"
          ! grep -Eqi 'Phone Test|debugphone|phonepreview|CROWNFALL TEST|Android Preview|firebase|adsbygoogle|websocket' "$H"

          python - <<'PY'
          from pathlib import Path
          import re
          t=Path("CROWNFALL_Stronghold_Android/app/src/main/assets/www/index.html").read_text(encoding="utf-8")
          m=re.search(r"<script>(.*)</script>", t, re.S)
          assert m, "script block missing"
          Path("/tmp/crownfall-internal.js").write_text(m.group(1), encoding="utf-8")
          urls=re.findall(r'https?://[^"\'<>\s]+', t, re.I)
          allowed={"http://www.w3.org/2000/svg"}
          unexpected=[u for u in urls if u not in allowed]
          assert not unexpected, f"Unexpected network URLs: {unexpected}"
          PY
          node --check /tmp/crownfall-internal.js

      - name: Build internal-test AAB
        working-directory: CROWNFALL_Stronghold_Android
        run: gradle :app:bundleRelease --stacktrace

      - name: Verify unsigned AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB="CROWNFALL_Stronghold_Android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          unzip -p "$AAB" base/assets/www/index.html > /tmp/bundled-index.html
          grep -q 'CROWNFALL: STRONGHOLD' /tmp/bundled-index.html
          grep -q 'الإصدار 2.1.2' /tmp/bundled-index.html
          grep -q 'سياسة الخصوصية' /tmp/bundled-index.html
          sha256sum "$AAB" | tee /tmp/unsigned-aab-sha256.txt

      - name: Upload internal-test AAB
        uses: actions/upload-artifact@v4
        with:
          name: CROWNFALL-2.1.2-InternalTest-Unsigned-AAB
          path: |
            CROWNFALL_Stronghold_Android/app/build/outputs/bundle/release/app-release.aab
            /tmp/unsigned-aab-sha256.txt
          if-no-files-found: error
