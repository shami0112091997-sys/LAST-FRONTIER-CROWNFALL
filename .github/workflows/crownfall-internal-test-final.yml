name: CROWNFALL Internal Test Final

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/crownfall-internal-test-final.yml"

jobs:
  build-internal-test:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 16 toolchain
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Deep production preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          G=Path("CROWNFALL_Stronghold_Android/app/build.gradle.kts").read_text(encoding="utf-8")
          M=Path("CROWNFALL_Stronghold_Android/app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          J=Path("CROWNFALL_Stronghold_Android/app/src/main/java/com/crownfall/stronghold/MainActivity.java").read_text(encoding="utf-8")
          H=Path("CROWNFALL_Stronghold_Android/app/src/main/assets/www/index.html").read_text(encoding="utf-8")

          checks=[
            ('namespace', 'namespace = "com.crownfall.stronghold"' in G),
            ('applicationId', 'applicationId = "com.crownfall.stronghold"' in G),
            ('versionCode 212', 'versionCode = 212' in G),
            ('versionName 2.1.2', 'versionName = "2.1.2"' in G),
            ('compileSdk 36', 'compileSdk = 36' in G),
            ('targetSdk 36', 'targetSdk = 36' in G),
            ('minSdk 23', 'minSdk = 23' in G),
            ('testOnly false', 'android:testOnly="false"' in M),
            ('landscape', 'android:screenOrientation="landscape"' in M),
            ('no INTERNET permission', 'android.permission.INTERNET' not in M),
            ('local asset load', 'file:///android_asset/www/index.html' in J),
            ('immersive fix', 'decor.getWindowInsetsController()' in J and 'webView.post(this::immersive)' in J),
            ('production title', 'CROWNFALL: STRONGHOLD' in H),
            ('version label', 'الإصدار 2.1.2' in H),
            ('privacy disclosure', 'سياسة الخصوصية' in H),
            ('save key', 'crownfall_v100_android' in H),
          ]
          bad=[name for name,ok in checks if not ok]
          assert not bad, "Preflight failed: "+", ".join(bad)

          forbidden=['Phone Test','debugphone','phonepreview','CROWNFALL TEST','Android Preview','firebase','adsbygoogle','websocket']
          found=[x for x in forbidden if x.lower() in H.lower()]
          assert not found, "Forbidden production markers: "+", ".join(found)

          urls=re.findall(r'https?://[^"\'<>\s]+', H, re.I)
          allowed={"http://www.w3.org/2000/svg"}
          unexpected=[u for u in urls if u not in allowed]
          assert not unexpected, f"Unexpected network URLs: {unexpected}"

          m=re.search(r"<script>(.*)</script>", H, re.S)
          assert m, "script block missing"
          Path("/tmp/crownfall-internal.js").write_text(m.group(1), encoding="utf-8")
          print("PREFLIGHT_OK")
          PY
          node --check /tmp/crownfall-internal.js
          echo "JS_SYNTAX_OK"

      - name: Build internal-test AAB
        working-directory: CROWNFALL_Stronghold_Android
        run: gradle :app:bundleRelease --stacktrace

      - name: Verify unsigned AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB="CROWNFALL_Stronghold_Android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          unzip -p "$AAB" base/assets/www/index.html > /tmp/bundled-index.html
          grep -q 'CROWNFALL: STRONGHOLD' /tmp/bundled-index.html
          grep -q 'الإصدار 2.1.2' /tmp/bundled-index.html
          grep -q 'سياسة الخصوصية' /tmp/bundled-index.html
          sha256sum "$AAB" | tee /tmp/unsigned-aab-sha256.txt

      - name: Upload internal-test AAB
        uses: actions/upload-artifact@v4
        with:
          name: CROWNFALL-2.1.2-InternalTest-Unsigned-AAB
          path: |
            CROWNFALL_Stronghold_Android/app/build/outputs/bundle/release/app-release.aab
            /tmp/unsigned-aab-sha256.txt
          if-no-files-found: error
