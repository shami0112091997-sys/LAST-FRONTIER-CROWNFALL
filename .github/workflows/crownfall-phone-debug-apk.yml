name: CROWNFALL Phone Debug APK

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/crownfall-phone-debug-apk.yml"

jobs:
  build-debug-phone:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android toolchain
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Create no-conflict debug package
        shell: bash
        run: |
          set -euo pipefail
          G="CROWNFALL_Stronghold_Android/app/build.gradle.kts"
          M="CROWNFALL_Stronghold_Android/app/src/main/AndroidManifest.xml"
          sed -i 's/applicationId = "com.crownfall.stronghold"/applicationId = "com.crownfall.stronghold.debugphone"/' "$G"
          sed -i 's/manifestPlaceholders\["appLabel"\] = "CROWNFALL: Stronghold"/manifestPlaceholders["appLabel"] = "CROWNFALL Phone Test"/' "$G"
          sed -i 's/android:name="\.MainActivity"/android:name="com.crownfall.stronghold.MainActivity"/' "$M"

      - name: Build Android-signed debug APK
        working-directory: CROWNFALL_Stronghold_Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify debug APK signature and package
        shell: bash
        run: |
          APK="CROWNFALL_Stronghold_Android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | head -20 || true
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"

      - name: Upload phone debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CROWNFALL-2.1.1-PhoneDebug-Installable
          path: CROWNFALL_Stronghold_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
