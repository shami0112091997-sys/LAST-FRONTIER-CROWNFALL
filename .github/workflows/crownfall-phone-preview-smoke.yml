name: CROWNFALL Phone Preview Smoke

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/crownfall-phone-preview-smoke.yml"

jobs:
  preview-smoke:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android toolchain
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Create side-by-side preview package
        shell: bash
        run: |
          set -euo pipefail
          G="CROWNFALL_Stronghold_Android/app/build.gradle.kts"
          M="CROWNFALL_Stronghold_Android/app/src/main/AndroidManifest.xml"
          sed -i 's/applicationId = "com.crownfall.stronghold"/applicationId = "com.crownfall.stronghold.phonepreview"/' "$G"
          sed -i 's/manifestPlaceholders\["appLabel"\] = "CROWNFALL: Stronghold"/manifestPlaceholders["appLabel"] = "CROWNFALL: Stronghold Test"/' "$G"
          sed -i 's/android:name="\.MainActivity"/android:name="com.crownfall.stronghold.MainActivity"/' "$M"

      - name: Build debug preview APK
        working-directory: CROWNFALL_Stronghold_Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install preview package on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r CROWNFALL_Stronghold_Android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.crownfall.stronghold.phonepreview/com.crownfall.stronghold.MainActivity
            sleep 8
            adb shell pidof com.crownfall.stronghold.phonepreview
            adb logcat -d | grep -E "FATAL EXCEPTION|ANR in com.crownfall.stronghold.phonepreview" && exit 1 || true
            echo CROWNFALL_PHONE_PREVIEW_INSTALL_PASS
