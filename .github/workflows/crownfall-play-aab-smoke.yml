name: CROWNFALL Google Play AAB Smoke

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/crownfall-play-aab-smoke.yml"

jobs:
  play-aab-smoke:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android toolchain
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate production identity
        shell: bash
        run: |
          set -euo pipefail
          G="CROWNFALL_Stronghold_Android/app/build.gradle.kts"
          M="CROWNFALL_Stronghold_Android/app/src/main/AndroidManifest.xml"
          H="CROWNFALL_Stronghold_Android/app/src/main/assets/www/index.html"
          grep -q 'applicationId = "com.crownfall.stronghold"' "$G"
          grep -q 'versionName = "2.1.2"' "$G"
          grep -q 'versionCode = 212' "$G"
          grep -q 'targetSdk = 36' "$G"
          grep -q 'android:testOnly="false"' "$M"
          ! grep -q 'android.permission.INTERNET' "$M"
          ! grep -Eqi "Phone Test|debugphone|phonepreview|CROWNFALL TEST|Android Preview" "$H"

      - name: Build production AAB
        working-directory: CROWNFALL_Stronghold_Android
        run: gradle :app:bundleRelease --stacktrace

      - name: Download bundletool
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3             -o /tmp/bundletool.jar             https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
          java -jar /tmp/bundletool.jar version

      - name: Generate temporary test keystore
        shell: bash
        run: |
          keytool -genkeypair -v             -keystore /tmp/play-smoke.jks             -storepass android             -alias play-smoke             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=CROWNFALL Play Smoke,O=OpenAI Test,C=US"

      - name: Build universal APK from AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB="CROWNFALL_Stronghold_Android/app/build/outputs/bundle/release/app-release.aab"
          java -jar /tmp/bundletool.jar build-apks             --bundle="$AAB"             --output=/tmp/crownfall.apks             --mode=universal             --ks=/tmp/play-smoke.jks             --ks-key-alias=play-smoke             --ks-pass=pass:android             --key-pass=pass:android
          unzip -p /tmp/crownfall.apks universal.apk > /tmp/CROWNFALL-2.1.2-universal.apk
          test -s /tmp/CROWNFALL-2.1.2-universal.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose /tmp/CROWNFALL-2.1.2-universal.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging /tmp/CROWNFALL-2.1.2-universal.apk | tee /tmp/crownfall_badging.txt
          grep -q "package: name='com.crownfall.stronghold' versionCode='212' versionName='2.1.2'" /tmp/crownfall_badging.txt
          if grep -q "uses-permission: name='android.permission.INTERNET'" /tmp/crownfall_badging.txt; then
            echo "Unexpected INTERNET permission"
            exit 1
          fi

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install AAB-derived APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash CROWNFALL_Stronghold_Android/play_aab_smoke.sh

      - name: Upload AAB smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CROWNFALL-2.1.2-Play-AAB-Smoke-Evidence
          path: |
            /tmp/crownfall_badging.txt
            /tmp/crownfall_start.txt
            /tmp/crownfall_pid.txt
            /tmp/crownfall_play_logcat.txt
            /tmp/crownfall_play_screen.png
          if-no-files-found: warn
