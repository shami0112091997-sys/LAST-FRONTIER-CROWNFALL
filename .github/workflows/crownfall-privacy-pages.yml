name: Publish CROWNFALL Privacy Policy

on:
  push:
    branches: [ "main" ]
    paths:
      - "privacy-site/**"
      - ".github/workflows/crownfall-privacy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "crownfall-privacy-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload privacy site
        uses: actions/upload-pages-artifact@v3
        with:
          path: privacy-site

      - name: Deploy privacy site
        id: deployment
        uses: actions/deploy-pages@v4
