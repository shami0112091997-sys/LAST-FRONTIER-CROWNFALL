name: Fetch Android APK Signer

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/fetch-android-apk-signer.yml"

jobs:
  fetch-tool:
    runs-on: ubuntu-latest
    steps:
      - name: Download trusted APK signer
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3             -o uber-apk-signer-1.3.0.jar             https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          echo "e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835  uber-apk-signer-1.3.0.jar" | sha256sum -c -

      - name: Upload signer tool
        uses: actions/upload-artifact@v4
        with:
          name: trusted-uber-apk-signer-1.3.0
          path: uber-apk-signer-1.3.0.jar
          if-no-files-found: error
