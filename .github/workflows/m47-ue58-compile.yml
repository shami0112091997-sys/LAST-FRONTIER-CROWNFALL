name: CROWNFALL Android v0.8 + UE5.8 Compile

on:
  workflow_dispatch: {}
  push:
    branches:
      - crownfall-stronghold-android-v0.8

jobs:
  compile-unreal:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LAST FRONTIER
        uses: actions/checkout@v4
      - name: Verify Unreal project
        run: test -f "LastFrontier_Build_001/LastFrontier.uproject"
      - name: Check for Unreal Engine
        id: unreal
        run: |
          if [ -x "/opt/UnrealEngine/Engine/Build/BatchFiles/Linux/Build.sh" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Compile LAST FRONTIER
        if: steps.unreal.outputs.available == 'true'
        run: |
          /opt/UnrealEngine/Engine/Build/BatchFiles/Linux/Build.sh \
            LastFrontierEditor Linux Development \
            "$(pwd)/LastFrontier_Build_001/LastFrontier.uproject" \
            -Progress -NoHotReloadFromIDE
      - name: Report engine requirement
        if: steps.unreal.outputs.available != 'true'
        run: echo "UE5.8 runner required for the Unreal compile."

  build-crownfall-android:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build CROWNFALL APK
        working-directory: CROWNFALL_Stronghold_Android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CROWNFALL-Stronghold-v0.8-debug-apk
          path: CROWNFALL_Stronghold_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
