name: M49 UE5.8 Cloud Compile - Disk Fix

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/m49-ue58-cloud-compile.yml"

permissions:
  contents: read
  packages: read

jobs:
  unreal-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout LAST FRONTIER
        uses: actions/checkout@v4

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail
          test -f LastFrontier_Build_001/LastFrontier.uproject
          test -f LastFrontier_Build_001/Source/LastFrontier/LastFrontier.Build.cs
          test -f LastFrontier_Build_001/Source/LastFrontier/LastFrontier.cpp
          test -f LastFrontier_Build_001/Source/LastFrontier.Target.cs
          test -f LastFrontier_Build_001/Source/LastFrontierEditor.Target.cs
          echo "M49_PROJECT_PREFLIGHT=PASS"

      - name: Login to Epic GHCR
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.EPIC_GHCR_TOKEN }}" | docker login ghcr.io \
            -u "${{ secrets.EPIC_GHCR_USER }}" \
            --password-stdin
          echo "M49_EPIC_GHCR_LOGIN=PASS"

      - name: Aggressive disk cleanup
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Disk before cleanup ==="
          df -h /

          sudo swapoff -a || true
          sudo rm -f /swapfile || true

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/julia* || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/vcpkg || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/lib/jvm || true
          sudo rm -rf /opt/az || true
          sudo rm -rf /usr/local/aws-cli || true
          sudo rm -rf /usr/share/miniconda || true
          sudo rm -rf /usr/local/lib/node_modules || true

          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          docker system prune -af --volumes || true

          echo "=== Disk after cleanup ==="
          df -h /
          docker system df || true

          AVAILABLE_KB=$(df --output=avail -k / | tail -1 | tr -d ' ')
          echo "M49_AVAILABLE_KB=$AVAILABLE_KB"
          if [ "$AVAILABLE_KB" -lt 52428800 ]; then
            echo "M49_DISK_STATUS=LOW"
            echo "Less than 50 GiB is available after cleanup."
            exit 1
          fi
          echo "M49_DISK_STATUS=PASS"

      - name: Pull Unreal Engine 5.8
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/epicgames/unreal-engine:dev-slim-5.8.0
          echo "M49_UE_IMAGE_PULL=PASS"
          df -h /
          docker system df || true

      - name: Compile LAST FRONTIER
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod -R a+rwX LastFrontier_Build_001
          docker run --rm \
            -v "$GITHUB_WORKSPACE/LastFrontier_Build_001:/project" \
            ghcr.io/epicgames/unreal-engine:dev-slim-5.8.0 \
            /home/ue4/UnrealEngine/Engine/Build/BatchFiles/Linux/Build.sh \
            LastFrontierEditor Linux Development \
            /project/LastFrontier.uproject \
            -Progress -NoHotReloadFromIDE

      - name: Verify binaries
        shell: bash
        run: |
          set -euo pipefail
          test -d LastFrontier_Build_001/Binaries
          find LastFrontier_Build_001/Binaries -type f -print
          COUNT=$(find LastFrontier_Build_001/Binaries -type f | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "M49_COMPILE_STATUS=FAIL"
            exit 1
          fi
          echo "M49_BINARY_COUNT=$COUNT"
          echo "M49_COMPILE_STATUS=PASS"

      - name: Upload compile evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M49-LastFrontier-Linux-Binaries
          path: LastFrontier_Build_001/Binaries
          if-no-files-found: error
          compression-level: 0
