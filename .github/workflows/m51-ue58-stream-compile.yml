name: M53 UE5.8 Stream Compile - Preserve Documentation Module

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/m51-ue58-stream-compile.yml"
      - "LastFrontier_Build_001/Source/**"
      - "LastFrontier_Build_001/LastFrontier.uproject"
      - "LastFrontier_Build_001/Config/**"

permissions:
  contents: read
  packages: read

jobs:
  unreal-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      UE_IMAGE: ghcr.io/epicgames/unreal-engine:dev-slim-5.8.0
      UE_ROOT: /tmp/UE58

    steps:
      - name: Checkout LAST FRONTIER
        uses: actions/checkout@v4

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail
          test -f LastFrontier_Build_001/LastFrontier.uproject
          test -f LastFrontier_Build_001/Source/LastFrontier/LastFrontier.Build.cs
          test -f LastFrontier_Build_001/Source/LastFrontier/LastFrontier.cpp
          test -f LastFrontier_Build_001/Source/LastFrontier.Target.cs
          test -f LastFrontier_Build_001/Source/LastFrontierEditor.Target.cs
          echo "M53_PROJECT_PREFLIGHT=PASS"

      - name: Deep free-space cleanup
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Before cleanup ==="
          df -h /
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/julia* || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/vcpkg || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/local/share/edge_driver || true
          sudo rm -rf /usr/local/share/chrome_driver || true
          sudo rm -rf /usr/local/share/gecko_driver || true
          sudo rm -rf /usr/lib/jvm || true
          sudo rm -rf /opt/az /opt/microsoft || true
          sudo rm -rf /usr/local/aws-cli || true
          sudo rm -rf /usr/share/miniconda || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf /usr/share/gradle || true
          sudo rm -rf /usr/local/sqlpackage || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          docker system prune -af --volumes || true
          echo "=== After cleanup ==="
          df -h /
          echo "M53_CLEANUP=PASS"

      - name: Setup crane
        uses: imjasonh/setup-crane@v0.7

      - name: Login to Epic GHCR with crane
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.EPIC_GHCR_TOKEN }}" | crane auth login ghcr.io \
            -u "${{ secrets.EPIC_GHCR_USER }}" \
            --password-stdin
          crane digest --platform=linux/amd64 "$UE_IMAGE"
          echo "M53_EPIC_GHCR_LOGIN=PASS"

      - name: Stream UnrealEngine preserving build modules
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf "$UE_ROOT"
          sudo mkdir -p "$UE_ROOT"
          sudo chown "$USER:$USER" "$UE_ROOT"

          echo "Streaming /home/ue4/UnrealEngine while preserving source build modules..."
          crane export --platform=linux/amd64 "$UE_IMAGE" - | \
            tar -xpf - -C "$UE_ROOT" \
              --wildcards \
              --strip-components=3 \
              --exclude='*/Content/*' \
              --exclude='*/FeaturePacks/*' \
              --exclude='*/Templates/*' \
              --exclude='*/Samples/*' \
              --exclude='home/ue4/UnrealEngine/Engine/DerivedDataCache/*' \
              'home/ue4/UnrealEngine/*'

          echo "=== Engine footprint ==="
          du -sh "$UE_ROOT" || true
          df -h /

          test -f "$UE_ROOT/Engine/Build/BatchFiles/Linux/Build.sh"
          test -f "$UE_ROOT/Engine/Binaries/DotNET/UnrealBuildTool/UnrealBuildTool.dll"

          DDC_RULE=$(find "$UE_ROOT/Engine/Source" -type f -name 'DerivedDataCache.Build.cs' -print -quit)
          if [ -z "$DDC_RULE" ]; then
            echo "M53_DERIVED_DATA_CACHE_RULE=FAIL"
            exit 1
          fi
          echo "M53_DERIVED_DATA_CACHE_RULE=$DDC_RULE"

          DOC_RULE=$(find "$UE_ROOT/Engine/Source" -type f -name 'Documentation.Build.cs' -print -quit)
          if [ -z "$DOC_RULE" ]; then
            echo "M53_DOCUMENTATION_RULE=FAIL"
            exit 1
          fi
          echo "M53_DOCUMENTATION_RULE=$DOC_RULE"

          chmod +x "$UE_ROOT/Engine/Build/BatchFiles/Linux/Build.sh"
          echo "M53_ENGINE_EXTRACT=PASS"

      - name: Compile LAST FRONTIER directly
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/LastFrontier_Build_001/LastFrontier.uproject"
          LOG="$GITHUB_WORKSPACE/M53-compile.log"

          chmod -R u+rwX "$GITHUB_WORKSPACE/LastFrontier_Build_001"
          cd "$UE_ROOT"

          set +e
          Engine/Build/BatchFiles/Linux/Build.sh \
            LastFrontierEditor Linux Development \
            "$PROJECT" \
            -Progress -NoHotReloadFromIDE 2>&1 | tee "$LOG"
          BUILD_RC=${PIPESTATUS[0]}
          set -e

          echo "M53_BUILD_EXIT_CODE=$BUILD_RC"
          if [ "$BUILD_RC" -ne 0 ]; then
            echo "=== Compile tail ==="
            tail -200 "$LOG" || true
            exit "$BUILD_RC"
          fi
          echo "M53_COMPILE_COMMAND=PASS"

      - name: Verify binaries
        shell: bash
        run: |
          set -euo pipefail
          test -d LastFrontier_Build_001/Binaries
          find LastFrontier_Build_001/Binaries -type f -print
          COUNT=$(find LastFrontier_Build_001/Binaries -type f | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "M53_COMPILE_STATUS=FAIL"
            exit 1
          fi
          echo "M53_BINARY_COUNT=$COUNT"
          echo "M53_COMPILE_STATUS=PASS"

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M53-Compile-Log
          path: M53-compile.log
          if-no-files-found: ignore
          compression-level: 6

      - name: Upload compiled binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M53-LastFrontier-Linux-Binaries
          path: LastFrontier_Build_001/Binaries
          if-no-files-found: error
          compression-level: 0
