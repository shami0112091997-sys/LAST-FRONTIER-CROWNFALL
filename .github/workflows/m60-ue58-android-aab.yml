name: M60 UE5.8 Android AAB

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/m60-ue58-android-aab.yml"
      - "LastFrontier_Build_001/Source/**"
      - "LastFrontier_Build_001/Config/**"
      - "LastFrontier_Build_001/LastFrontier.uproject"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  android-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      UE_IMAGE: ghcr.io/epicgames/unreal-engine:dev-slim-5.8.0
      WORK_ROOT: /mnt/crownfall-m60-android
      UE_ROOT: /mnt/crownfall-m60-android/UE58
      PROJECT_REL: LastFrontier_Build_001/LastFrontier.uproject
      PROJECT_DIR: ${{ github.workspace }}/LastFrontier_Build_001
      ARCHIVE_DIR: /mnt/crownfall-m60-android/Android-Archive
      NDK_VERSION: 27.2.12479018

    steps:
      - name: Checkout LAST FRONTIER
        uses: actions/checkout@v4

      - name: Prepare high-capacity Unreal work paths
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf "$WORK_ROOT"
          sudo mkdir -p "$WORK_ROOT/Zen" "$WORK_ROOT/DDC" "$WORK_ROOT/project-Saved" "$WORK_ROOT/project-Intermediate"
          sudo chown -R "$USER:$USER" "$WORK_ROOT"
          rm -rf LastFrontier_Build_001/Saved LastFrontier_Build_001/Intermediate
          ln -s "$WORK_ROOT/project-Saved" LastFrontier_Build_001/Saved
          ln -s "$WORK_ROOT/project-Intermediate" LastFrontier_Build_001/Intermediate
          df -h / /mnt || true
          echo "M60_ANDROID_WORK_PATHS=PASS"

      - name: Verify Android release identity
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_REL"
          grep -Fq 'PackageName=com.crownfall.stronghold' LastFrontier_Build_001/Config/DefaultEngine.ini
          grep -Fq 'StoreVersion=215' LastFrontier_Build_001/Config/DefaultEngine.ini
          grep -Fq 'VersionDisplayName=2.2.0' LastFrontier_Build_001/Config/DefaultEngine.ini
          grep -Fq 'MinSDKVersion=26' LastFrontier_Build_001/Config/DefaultEngine.ini
          grep -Fq 'TargetSDKVersion=36' LastFrontier_Build_001/Config/DefaultEngine.ini
          grep -Fq 'bBuildForArm64=True' LastFrontier_Build_001/Config/DefaultEngine.ini
          grep -Fq 'bEnableBundle=True' LastFrontier_Build_001/Config/DefaultEngine.ini
          echo "M60_ANDROID_IDENTITY=PASS"

      - name: Reclaim runner space
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Before cleanup ==="
          df -h /
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/julia* || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/vcpkg || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /opt/az /opt/microsoft || true
          sudo rm -rf /usr/local/aws-cli || true
          sudo rm -rf /usr/share/miniconda || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf /usr/share/gradle || true
          sudo apt-get clean || true
          docker system prune -af --volumes || true
          echo "=== After cleanup ==="
          df -h /
          test -d /usr/local/lib/android/sdk
          echo "M60_ANDROID_RUNNER_CLEANUP=PASS"

      - name: Setup crane
        uses: imjasonh/setup-crane@v0.7

      - name: Login to Epic GHCR
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.EPIC_GHCR_TOKEN }}" | crane auth login ghcr.io             -u "${{ secrets.EPIC_GHCR_USER }}"             --password-stdin
          crane digest --platform=linux/amd64 "$UE_IMAGE"
          echo "M60_EPIC_GHCR_LOGIN=PASS"

      - name: Stream Unreal Engine 5.8
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf "$UE_ROOT"
          sudo mkdir -p "$UE_ROOT"
          sudo chown "$USER:$USER" "$UE_ROOT"

          crane export --platform=linux/amd64 "$UE_IMAGE" - |             tar -xpf - -C "$UE_ROOT"               --wildcards               --strip-components=3               --exclude='home/ue4/UnrealEngine/FeaturePacks/*'               --exclude='home/ue4/UnrealEngine/Templates/*'               --exclude='home/ue4/UnrealEngine/Samples/*'               --exclude='home/ue4/UnrealEngine/Engine/DerivedDataCache/*'               --exclude='home/ue4/UnrealEngine/Engine/Plugins/*/Content/*'               'home/ue4/UnrealEngine/*'

          TEST_DIR="$UE_ROOT/Engine/Source/Runtime/CoreUObject/Tests"
          [ ! -d "$TEST_DIR" ] || rm -rf "$TEST_DIR"

          test -x "$UE_ROOT/Engine/Build/BatchFiles/Linux/Build.sh"
          test -x "$UE_ROOT/Engine/Build/BatchFiles/RunUAT.sh"
          test -d "$UE_ROOT/Engine/Platforms/Android"
          test -d "$UE_ROOT/Engine/Content"
          echo "M60_UE58_ANDROID_ENGINE=PASS"
          df -h /

      - name: Build LastFrontierEditor
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/$PROJECT_REL"
          chmod -R u+rwX "$PROJECT_DIR"
          env "UE-ZenDataPath=$WORK_ROOT/Zen" "UE-LocalDataCachePath=$WORK_ROOT/DDC"             "$UE_ROOT/Engine/Build/BatchFiles/Linux/Build.sh"             LastFrontierEditor Linux Development             "$PROJECT"             -Progress -NoHotReloadFromIDE 2>&1 | tee "$GITHUB_WORKSPACE/M60-android-editor-build.log"
          echo "M60_ANDROID_EDITOR_BUILD=PASS"

      - name: Verify committed genuine TestMap
        shell: bash
        run: |
          set -euo pipefail
          MAP_FILE="$PROJECT_DIR/Content/Maps/TestMap.umap"
          test -s "$MAP_FILE"
          file "$MAP_FILE"
          sha256sum "$MAP_FILE"
          echo "M60_ANDROID_COMMITTED_TESTMAP=PASS"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android command line tools
        uses: android-actions/setup-android@v3

      - name: Install UE5.8 Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "NDKROOT=$SDKROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "NDK_ROOT=$SDKROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

          sdkmanager             "platform-tools"             "platforms;android-36"             "build-tools;35.0.1"             "ndk;$NDK_VERSION"

          test -d "$SDKROOT/platforms/android-36"
          test -d "$SDKROOT/build-tools/35.0.1"
          test -d "$SDKROOT/ndk/$NDK_VERSION"
          java -version
          echo "M60_ANDROID_TOOLCHAIN=PASS"
          df -h /

      - name: Validate Unreal Android SDK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/$PROJECT_REL"
          cd "$UE_ROOT"
          dotnet Engine/Binaries/DotNET/UnrealBuildTool/UnrealBuildTool.dll             -Mode=ValidatePlatforms -OutputSDKs -AllPlatforms             -project="$PROJECT"             -log="$GITHUB_WORKSPACE/M60-android-sdk-validation.log"             -verbose -timestamps -progress || true
          cat "$GITHUB_WORKSPACE/M60-android-sdk-validation.log"
          grep -E 'Android VALID|Android.*r27c' "$GITHUB_WORKSPACE/M60-android-sdk-validation.log"
          echo "M60_ANDROID_SDK_VALID=PASS"

      - name: Build Cook Package Android AAB
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/$PROJECT_REL"
          rm -rf "$ARCHIVE_DIR"
          mkdir -p "$ARCHIVE_DIR"
          cd "$UE_ROOT"

          env "UE-ZenDataPath=$WORK_ROOT/Zen" "UE-LocalDataCachePath=$WORK_ROOT/DDC"             Engine/Build/BatchFiles/RunUAT.sh BuildCookRun             -project="$PROJECT"             -noP4             -build             -cook             -map=/Game/Maps/TestMap             -stage             -pak             -package             -archive             -archivedirectory="$ARCHIVE_DIR"             -platform=Android             -cookflavor=ASTC             -clientconfig=Development             -unattended             -ddc=noshared             -skipzenstore             -utf8output 2>&1 | tee "$GITHUB_WORKSPACE/M60-android-package.log"

          echo "M60_ANDROID_BUILDKOOKPACKAGE=PASS"

      - name: Locate and verify AAB
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Android archive ==="
          find "$ARCHIVE_DIR" -maxdepth 8 -type f -print | sort

          AAB="$(find "$ARCHIVE_DIR" "$PROJECT_DIR" -type f -name '*.aab' -print -quit)"
          if [ -z "$AAB" ]; then
            echo "M60_ANDROID_AAB=NOT_FOUND"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/M60-AAB"
          cp "$AAB" "$GITHUB_WORKSPACE/M60-AAB/CROWNFALL_Unreal_2.2.0_v215_unsigned.aab"
          unzip -t "$GITHUB_WORKSPACE/M60-AAB/CROWNFALL_Unreal_2.2.0_v215_unsigned.aab"
          sha256sum "$GITHUB_WORKSPACE/M60-AAB/CROWNFALL_Unreal_2.2.0_v215_unsigned.aab" | tee "$GITHUB_WORKSPACE/M60-AAB/SHA256SUMS.txt"
          echo "M60_ANDROID_AAB=PASS"

      - name: Upload Android AAB and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M60-CROWNFALL-Unreal-Android-v215
          path: |
            M60-AAB/
            M60-android-editor-build.log
            M60-android-map.log
            M60-android-sdk-validation.log
            M60-android-package.log
          if-no-files-found: ignore
          compression-level: 0
