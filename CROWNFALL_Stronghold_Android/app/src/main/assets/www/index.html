<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CROWNFALL: STRONGHOLD</title><style>:root{--bg:#07121d;--p:rgba(7,20,32,.72);--cyan:#66e6ff;--ph:#7dff8c;--ruby:#e94b64;--coral:#ff7c68;--gold:#e7bd5c;--txt:#f7fbff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:system-ui,Tahoma,Arial}body{touch-action:none}#g{position:relative;width:100vw;height:100vh;background:radial-gradient(circle at 50% 10%,#66e6ff20,transparent 22%),radial-gradient(circle at 14% 30%,#e94b6416,transparent 24%),linear-gradient(#123641,#1a4a42 50%,#14382e)}.glass{background:linear-gradient(#ffffff0d,#ffffff03),var(--p);border:1px solid #66e6ff40;box-shadow:inset 0 1px 0 #ffffff18,0 7px 18px #0005;backdrop-filter:blur(9px)}.top{position:absolute;top:0;left:0;right:0;padding:8px;display:flex;justify-content:space-between;z-index:20}.profile,.pill{padding:7px 10px;border-radius:14px;font-size:10px;font-weight:900}.res{display:flex;gap:5px}#map{position:absolute;inset:55px 0 135px;background-image:linear-gradient(#ffffff0c 1px,transparent 1px),linear-gradient(90deg,#ffffff0c 1px,transparent 1px);background-size:44px 44px}.obj{position:absolute;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:15px;display:grid;place-items:center;font-size:27px;border:1px solid #ffffff30;box-shadow:0 7px 12px #0007}.hq{background:linear-gradient(145deg,#66e6ff30,#1a3048)}.mine{background:linear-gradient(145deg,#e7bd5c30,#4c331a)}.pump{background:linear-gradient(145deg,#66e6ff2d,#1a354c)}.barracks{background:linear-gradient(145deg,#ff7c682c,#40273a)}.cannon{background:linear-gradient(145deg,#ffffff20,#293643)}.tower{background:linear-gradient(145deg,#b980ff33,#2d2647)}.hero{background:linear-gradient(145deg,#7dff8c2d,#214734)}.forge{background:linear-gradient(145deg,#ff7c6830,#46291b)}.lv{position:absolute;bottom:-9px;background:#07121de8;border-radius:7px;padding:1px 5px;font-size:8px}.bottom{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 8px;background:linear-gradient(transparent,#040a11e8 25%);z-index:20}.actions{display:flex;gap:7px;margin-bottom:7px}.actions button{flex:1;border:0;border-radius:14px;padding:10px;color:#fff;font-weight:900}.build{background:#216c87}.village{background:#326e45}.attack{background:#9b3045}.cards{display:flex;gap:7px;overflow:auto}.card{min-width:92px;padding:7px;border-radius:14px;text-align:center}.ico{font-size:25px}.card b{display:block;font-size:9px}.card small{font-size:7px;color:#d1dbe5}.overlay{display:none;position:absolute;inset:0;z-index:50;background:#000b;align-items:center;justify-content:center;padding:16px}.panel{width:min(520px,100%);border-radius:22px;padding:16px}.panel h2{margin:0 0 8px}.panel p{font-size:11px;line-height:1.6;color:#d8e2ea}.row{display:flex;gap:8px}.row button{flex:1;padding:10px;border-radius:13px;border:0;font-weight:900}.primary{background:#63cee0}.secondary{background:#ffffff12;color:#fff}.toast{position:absolute;left:50%;bottom:145px;transform:translateX(-50%);padding:8px 12px;border-radius:13px;z-index:60;opacity:0;transition:.2s;font-size:10px}.toast.show{opacity:1;bottom:154px}.splash{position:absolute;inset:0;z-index:80;background:radial-gradient(circle at 50% 35%,#66e6ff24,transparent 20%),radial-gradient(circle at 50% 40%,#e94b6430,transparent 34%),linear-gradient(160deg,#07121d,#1a2835 55%,#3c1d2a);display:flex;align-items:center;justify-content:center;padding:20px}.sbox{text-align:center;padding:24px;border-radius:24px;width:min(540px,100%)}.splash h1{margin:7px 0}.splash p{font-size:11px;color:#d3dde6}.splash button{width:100%;padding:12px;border:0;border-radius:14px;background:#58c4d7;font-weight:1000}</style></head><body><div id="g"><div class="top"><div class="profile glass">♛ CROWNFALL • Lv <span id="level">10</span></div><div class="res"><div class="pill glass">🪙 <span id="gold">3000</span></div><div class="pill glass">⚙️ <span id="steam">1900</span></div><div class="pill glass">💎 <span id="gems">82</span></div></div></div><div id="map"></div><div id="toast" class="toast glass"></div><div class="bottom"><div class="actions"><button class="build" id="build">🏗️ بناء</button><button class="village" id="villages">🏘️ القرى</button><button class="attack" id="attack">⚔️ هجوم</button></div><div id="cards" class="cards"></div></div><div id="overlay" class="overlay"><div class="panel glass"><h2 id="title"></h2><div id="body"></div><div class="row"><button class="secondary" id="close">إغلاق</button><button class="primary" id="action">تنفيذ</button></div></div></div><div id="splash" class="splash"><div class="sbox glass"><h1>CROWNFALL</h1><p>STRONGHOLD • فسفوري + ياقوت + مرجان • لمعان منخفض</p><button id="start">دخول القلعة</button></div></div></div><script>const $=x=>document.getElementById(x),map=$('map');const D={mine:['منجم','⛏️',190,0,'mine'],pump:['مولد','⚙️',90,135,'pump'],barracks:['ثكنة','🛡️',285,110,'barracks'],cannon:['مدفع','💣',340,155,'cannon'],tower:['برج أثيري','🔮',300,205,'tower'],hero:['قاعة الأبطال','👑',560,300,'hero'],forge:['مسبك','🔥',430,230,'forge']};let s={gold:3000,steam:1900,gems:82,level:10,sel:'mine',village:0,b:[]};function uid(){return Math.random().toString(36).slice(2,8)}function seed(){s.b=[['hq',50,40],['mine',34,53],['pump',66,53],['barracks',35,28],['cannon',65,28],['tower',50,62],['forge',25,63]].map(x=>({id:uid(),type:x[0],x:x[1],y:x[2],lv:x[0]=='hq'?4:1}))}function toast(t){let e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('show'),1300)}try{let x=JSON.parse(localStorage.getItem('crownfall_android'));if(x)s=x;else seed()}catch(e){seed()}function save(){localStorage.setItem('crownfall_android',JSON.stringify(s))}function ui(){$('gold').textContent=Math.floor(s.gold);$('steam').textContent=Math.floor(s.steam);$('gems').textContent=Math.floor(s.gems);$('level').textContent=s.level}function cards(){let c=$('cards');c.innerHTML='';Object.entries(D).forEach(([k,d])=>{let el=document.createElement('div');el.className='card glass';el.innerHTML=`<div class="ico">${d[1]}</div><b>${d[0]}</b><small>🪙${d[2]} ⚙️${d[3]}</small>`;el.onclick=()=>{s.sel=k;toast('اختر مكاناً للبناء')};c.appendChild(el)})}function render(){ui();cards();map.innerHTML='';s.b.forEach(b=>{let d=b.type==='hq'?['القيادة','🏰',0,0,'hq']:D[b.type];let el=document.createElement('div');el.className='obj '+d[4];el.style.left=b.x+'%';el.style.top=b.y+'%';el.innerHTML=`${d[1]}<div class="lv">Lv ${b.lv}</div>`;map.appendChild(el)})}map.addEventListener('pointerdown',e=>{if(e.target!==map)return;let d=D[s.sel],r=map.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;if(s.gold<d[2]||s.steam<d[3])return toast('الموارد غير كافية');if(s.b.some(b=>Math.hypot((b.x-x)*r.width/100,(b.y-y)*r.height/100)<55))return toast('المكان مشغول');s.gold-=d[2];s.steam-=d[3];s.b.push({id:uid(),type:s.sel,x,y,lv:1});save();render();toast('🏗️ تم البناء')});$('attack').onclick=()=>{let stars=1+Math.floor(Math.random()*3);s.gold+=180+stars*180;s.steam+=100+stars*110;s.gems+=stars===3?5:0;save();render();$('title').textContent=stars>=2?'🏆 انتصار':'⚔️ معركة صعبة';$('body').innerHTML=`<p style="text-align:center;font-size:28px;color:#e7bd5c">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</p><p>تمت إضافة الغنائم إلى قاعدتك.</p>`;$('action').style.display='none';$('overlay').style.display='flex'};$('villages').onclick=()=>{$('title').textContent='🏘️ القرى';$('body').innerHTML='<p>القلعة الرئيسية • قرية الضباب • قرية الجمر.</p>';$('action').style.display='block';$('action').textContent='القرية التالية';$('action').onclick=()=>{s.village=(s.village+1)%3;save();$('overlay').style.display='none';toast(['القلعة الرئيسية','قرية الضباب','قرية الجمر'][s.village])};$('overlay').style.display='flex'};$('build').onclick=()=>toast('🏗️ اختر مبنى من الأسفل');$('close').onclick=()=>$('overlay').style.display='none';$('start').onclick=()=>{$('splash').style.display='none';toast('✨ CROWNFALL v0.8')};render();</script></body></html>
