<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#061017"><title>CROWNFALL TEST 0.23</title><style>
:root{--bg:#061017;--glass:rgba(7,22,29,.82);--gold:#d9ad54;--ivory:#e8dfcb;--navy:#173653;--cyan:#74e8ff;--green:#79f39a;--ruby:#b83d55;--txt:#f7fbff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:system-ui,Tahoma,Arial}button{font-family:inherit}.game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:linear-gradient(#0a2025 0 19%,#9f8f6d 19.2% 20%,#173d3a 20% 100%)}.city{position:absolute;inset:62px 0 86px;overflow:hidden;background:radial-gradient(ellipse at 68% 28%,#fff0c222,transparent 30%),linear-gradient(180deg,#8d9ead 0 35%,#6a817f 35% 38%,#1d584a 38% 100%)}.city:before{content:"";position:absolute;inset:0;background:linear-gradient(155deg,transparent 0 22%,#d5cba13a 22.5% 23.8%,transparent 24.2% 45%,#d5cba12c 45.4% 46.4%,transparent 47%),radial-gradient(ellipse at 74% 35%,#e8dfcb44 0 13%,transparent 13.5%),radial-gradient(ellipse at 42% 64%,#8a6b4455 0 14%,transparent 14.5%);opacity:.9}.waterfall{position:absolute;right:5%;top:18%;width:12%;height:78%;background:linear-gradient(90deg,transparent,#c9f7ff77,#fff9,#c9f7ff66,transparent);filter:blur(2px);opacity:.55;transform:skewX(-7deg)}.glass{background:linear-gradient(#ffffff0d,#ffffff03),var(--glass);border:1px solid #d9ad5430;box-shadow:0 6px 18px #0005,inset 0 1px 0 #ffffff12;backdrop-filter:blur(8px)}.top{position:absolute;z-index:30;left:0;right:0;top:0;height:62px;padding:7px 9px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#061017ee,#06101799)}.profile{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:15px}.crest{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#e3ba60,#8a5a1d);display:grid;place-items:center;color:#fff;font-size:21px;font-weight:900}.ptext b{display:block;font-size:11px;letter-spacing:.6px}.ptext small{font-size:7px;color:#d7e3e8}.resources{display:flex;gap:5px;direction:ltr}.pill{min-width:82px;border-radius:14px;padding:7px 9px;text-align:center;font-size:10px;font-weight:900}.pill span{margin-left:3px}.quest{position:absolute;z-index:24;top:66px;left:50%;transform:translateX(-50%);width:min(330px,45vw);padding:6px 10px;border-radius:13px;font-size:8px;display:flex;align-items:center;gap:7px}.qbar{height:4px;flex:1;background:#0008;border-radius:99px;overflow:hidden}.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--green));width:20%}.side{position:absolute;z-index:25;top:42%;display:flex;flex-direction:column;gap:9px}.side.left{left:8px}.side.right{right:8px}.side button{width:44px;height:44px;border:1px solid #d9ad5428;border-radius:14px;color:#fff;background:#071923cc;font-size:19px;box-shadow:0 5px 12px #0005}.building{position:absolute;width:92px;height:105px;transform:translate(-50%,-50%);z-index:8;transition:.16s}.building.selected{transform:translate(-50%,-50%) scale(1.08);z-index:20}.pad{position:absolute;left:50%;bottom:11px;transform:translateX(-50%);width:76px;height:28px;border-radius:50%;background:radial-gradient(ellipse,#ead9aa33 0 40%,#3c2c1f33 45% 62%,transparent 70%);box-shadow:0 8px 13px #0005}.art{position:absolute;inset:0 0 14px;display:grid;place-items:end center;filter:drop-shadow(0 8px 8px #0007)}.art svg{width:88px;height:88px;overflow:visible}.building.hq .art svg{width:105px;height:102px}.lvl{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);padding:1px 5px;border-radius:7px;background:#061017df;border:1px solid #d9ad5440;font-size:7px;color:#ffe5a0}.name{position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);padding:2px 6px;border-radius:8px;background:#061017df;font-size:7px;white-space:nowrap;opacity:0}.selected .name,.hq .name{opacity:1}.hp{position:absolute;top:0;left:50%;transform:translateX(-50%);width:54px;height:4px;border-radius:99px;background:#0008;overflow:hidden;opacity:0}.selected .hp,.hq .hp{opacity:1}.hp i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#d8ffd8)}.stats{position:absolute;z-index:22;left:8px;top:70px;display:flex;gap:4px}.stat{font-size:7px;padding:3px 6px;border-radius:8px}.bottom{position:absolute;z-index:40;left:0;right:0;bottom:0;padding:10px 10px calc(9px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#030a0fee 30%)}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.actions button{height:43px;border:0;border-radius:15px;color:#fff;font-size:13px;font-weight:1000;box-shadow:0 6px 14px #0005}.build{background:linear-gradient(#3695b5,#21657d)}.train{background:linear-gradient(#62955e,#3c683c)}.battle{background:linear-gradient(#bd4159,#812b3d)}.drawer{position:absolute;left:9px;right:9px;bottom:68px;display:none;gap:6px;overflow-x:auto;padding:7px;border-radius:15px}.drawer.open{display:flex}.card{min-width:112px;padding:7px;border-radius:12px;border:1px solid #d9ad5430;background:#081923ee;color:#fff;text-align:center}.card b{display:block;font-size:8px}.card small{font-size:7px;color:#ccd8dd}.overlay{display:none;position:absolute;inset:0;z-index:80;background:#000c;align-items:center;justify-content:center;padding:16px}.panel{width:min(500px,92vw);padding:16px;border-radius:21px}.panel h2{margin:0 0 9px;font-size:18px}.panel p{font-size:11px;line-height:1.7;color:#d8e3e8}.row{display:flex;gap:7px}.row button{flex:1;padding:10px;border:0;border-radius:12px;font-weight:900}.primary{background:#54c6d9}.secondary{background:#ffffff14;color:#fff}.toast{position:absolute;z-index:90;left:50%;bottom:82px;transform:translateX(-50%) translateY(10px);opacity:0;transition:.18s;padding:7px 11px;border-radius:11px;font-size:9px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.splash{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#e2bb6538,transparent 19%),linear-gradient(145deg,#07131b,#173447 55%,#42242d);padding:20px}.sbox{width:min(520px,90vw);padding:24px;border-radius:24px;text-align:center}.sbox h1{margin:0;color:#f7ddb1;letter-spacing:1.5px}.sbox p{font-size:10px;color:#d5dfe5}.sbox button{width:100%;padding:12px;border:0;border-radius:14px;background:linear-gradient(#63d0df,#3b93aa);font-weight:1000}.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe7a6;box-shadow:0 0 10px #ffe7a6;animation:float 4s ease-in-out infinite alternate;opacity:.6}@keyframes float{to{transform:translateY(-28px);opacity:.15}}@media(max-height:500px){.top{height:56px}.city{inset:56px 0 78px}.quest{top:59px}.building{width:82px;height:94px}.art svg{width:78px;height:78px}.building.hq .art svg{width:96px;height:92px}.actions button{height:39px;font-size:12px}}
</style></head><body><div class="game"><div class="top"><div class="resources"><div class="pill glass">💎 <span id="gems">82</span></div><div class="pill glass">⚙️ <span id="steam">1900</span></div><div class="pill glass">🪙 <span id="gold">3000</span></div></div><div class="profile glass"><div class="ptext"><b>CROWNFALL</b><small>القائد Lv <span id="level">10</span> • قوة <span id="power">0</span></small></div><div class="crest">♛</div></div></div><div class="stats"><div class="stat glass">الحرس <span id="guards">5</span></div><div class="stat glass">الانتصارات <span id="wins">0</span></div></div><div class="quest glass"><b id="qtitle">ابنِ مبنيين جديدين</b><div class="qbar"><i id="qfill"></i></div></div><div class="city" id="map"><div class="waterfall"></div></div><div class="side left"><button id="hqBtn">♜</button><button id="heroBtn">♛</button></div><div class="side right"><button id="saveBtn">▣</button><button id="infoBtn">⚙</button></div><div class="drawer glass" id="drawer"></div><div class="bottom"><div class="actions"><button id="battleBtn" class="battle">⚔ معركة</button><button id="trainBtn" class="train">🎖 تدريب</button><button id="buildBtn" class="build">🏗 بناء</button></div></div><div class="overlay" id="overlay"><div class="panel glass"><h2 id="ovTitle"></h2><div id="ovBody"></div><div class="row"><button class="secondary" id="closeOv">إغلاق</button><button class="primary" id="ovAction">تنفيذ</button></div></div></div><div class="toast glass" id="toast"></div><div class="splash" id="splash"><div class="sbox glass"><h1>CROWNFALL: STRONGHOLD</h1><p>v0.23 Android Preview • ملكي + Victorian + Steampunk</p><button id="start">دخول المملكة</button></div></div></div><script>
const $=x=>document.getElementById(x),map=$('map'),ov=$('overlay');const TYPES={mine:{n:'منجم التاج',c:[190,0,0]},pump:{n:'مولد البخار',c:[90,135,0]},barracks:{n:'ثكنة الحرس',c:[285,110,0]},cannon:{n:'مدفع ملكي',c:[340,155,0]},tower:{n:'برج أثيري',c:[300,205,8]},forge:{n:'مسبك التاج',c:[430,230,10]},hero:{n:'قاعة الأبطال',c:[560,300,25]}};let st={gold:3000,steam:1900,gems:82,level:10,guards:5,wins:0,selected:'mine',quest:0,qprog:0,b:[{id:1,t:'hq',x:64,y:39,lv:4},{id:2,t:'tower',x:27,y:43,lv:2},{id:3,t:'forge',x:45,y:58,lv:1},{id:4,t:'mine',x:36,y:70,lv:2},{id:5,t:'pump',x:54,y:71,lv:2},{id:6,t:'barracks',x:72,y:61,lv:2},{id:7,t:'cannon',x:84,y:51,lv:1}]};try{let x=JSON.parse(localStorage.getItem('crownfall_v023_android'));if(x)st={...st,...x}}catch(e){};let selectedId=null;const Q=[['build',2,'ابنِ مبنيين جديدين'],['upgrade',2,'طوّر مبنيين'],['train',3,'درّب 3 حراس'],['battle',2,'انتصر في معركتين']];function save(silent=false){localStorage.setItem('crownfall_v023_android',JSON.stringify(st));if(!silent)toast('تم الحفظ')}function toast(t){let e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1200)}function power(){return st.b.reduce((a,b)=>a+(b.t==='hq'?80:34)*b.lv,0)+st.guards*8+st.wins*20}function ui(){$('gold').textContent=Math.floor(st.gold).toLocaleString('en-US');$('steam').textContent=Math.floor(st.steam).toLocaleString('en-US');$('gems').textContent=st.gems;$('level').textContent=st.level;$('guards').textContent=st.guards;$('wins').textContent=st.wins;$('power').textContent=power();let q=Q[st.quest%Q.length];$('qtitle').textContent=q[2];$('qfill').style.width=Math.min(100,st.qprog/q[1]*100)+'%'}function quest(k){let q=Q[st.quest%Q.length];if(q[0]!==k)return;st.qprog++;if(st.qprog>=q[1]){st.gold+=350;st.steam+=160;st.quest++;st.qprog=0;toast('اكتمل الهدف • تمت إضافة المكافأة')}ui();save(true)}function svg(t,lv){const g='#d9ad54',i='#e8dfcb',n='#173653',c=lv>=4?'#7cecff':'#ffd26c';let base=`<ellipse cx="50" cy="78" rx="36" ry="7" fill="#0006"/>`;if(t==='hq')return `<svg viewBox="0 0 100 90">${base}<rect x="18" y="35" width="64" height="40" rx="6" fill="${i}" stroke="${g}" stroke-width="2"/><path d="M14 37L30 13L44 37M56 37L72 11L88 37M30 35L50 5L70 35" fill="${n}" stroke="${g}" stroke-width="2"/><rect x="44" y="52" width="12" height="23" rx="6" fill="#26343a"/><circle cx="50" cy="31" r="6" fill="${c}"/></svg>`;if(t==='cannon')return `<svg viewBox="0 0 100 90">${base}<rect x="17" y="53" width="66" height="20" rx="6" fill="${i}" stroke="${g}" stroke-width="2"/><circle cx="39" cy="60" r="13" fill="${n}" stroke="${g}" stroke-width="2"/><path d="M45 50L81 31Q87 30 89 36L87 42L50 57Z" fill="${n}" stroke="${g}" stroke-width="3"/></svg>`;if(t==='tower')return `<svg viewBox="0 0 100 90">${base}<path d="M35 74L40 28H60L65 74Z" fill="${i}" stroke="${g}" stroke-width="2"/><path d="M34 30L50 7L66 30Z" fill="${n}" stroke="${g}" stroke-width="2"/><circle cx="50" cy="18" r="10" fill="${c}" stroke="#fff8" stroke-width="2"/><path d="M50 28v35" stroke="#68dff1" stroke-width="4" opacity=".8"/></svg>`;let dome=t==='pump'||t==='forge'?`<path d="M25 38Q50 8 75 38Z" fill="${n}" stroke="${g}" stroke-width="2"/>`:`<path d="M17 40L50 13L83 40Z" fill="${n}" stroke="${g}" stroke-width="2"/>`;let pipes=t==='pump'||t==='forge'?`<path d="M72 23v37M82 17v45M72 33h10" stroke="#a86d30" stroke-width="6"/>`:'';return `<svg viewBox="0 0 100 90">${base}<rect x="18" y="38" width="64" height="36" rx="6" fill="${i}" stroke="${g}" stroke-width="2"/>${dome}${pipes}<rect x="44" y="54" width="12" height="20" rx="4" fill="#24333a"/><rect x="28" y="49" width="8" height="11" rx="2" fill="${c}"/><rect x="64" y="49" width="8" height="11" rx="2" fill="${c}"/></svg>`}function nameOf(t){return t==='hq'?'القيادة':TYPES[t].n}function render(){ui();[...map.querySelectorAll('.building,.spark')].forEach(x=>x.remove());st.b.forEach(b=>{let e=document.createElement('div');e.className='building '+(b.t==='hq'?'hq ':'')+(selectedId===b.id?'selected':'');e.style.left=b.x+'%';e.style.top=b.y+'%';e.innerHTML=`<div class="pad"></div><div class="hp"><i style="width:100%"></i></div><div class="art">${svg(b.t,b.lv)}</div><div class="lvl">Lv ${b.lv}</div><div class="name">${nameOf(b.t)}</div>`;e.onclick=ev=>{ev.stopPropagation();selectedId=b.id;render();openBuilding(b)};map.appendChild(e)});for(let j=0;j<5;j++){let s=document.createElement('i');s.className='spark';s.style.left=(20+j*15)+'%';s.style.top=(38+(j%3)*14)+'%';s.style.animationDelay=(-j*.7)+'s';map.appendChild(s)}}function openBuilding(b){let base=b.t==='hq'?[700,400,5]:TYPES[b.t].c,g=Math.round(base[0]*(1+b.lv*.4)),s=Math.round(base[1]*(1+b.lv*.34)),d=Math.round(base[2]*(1+b.lv*.25));$('ovTitle').textContent=nameOf(b.t);$('ovBody').innerHTML=`<p>المستوى: <b>${b.lv}</b><br>قوة المبنى: <b>${(b.t==='hq'?80:34)*b.lv}</b><br><br>تكلفة التطوير: 🪙 ${g} • ⚙️ ${s} ${d?'• 💎 '+d:''}</p>`;$('ovAction').style.display='block';$('ovAction').textContent='⬆ تطوير';$('ovAction').onclick=()=>{if(st.gold<g||st.steam<s||st.gems<d)return toast('الموارد غير كافية');st.gold-=g;st.steam-=s;st.gems-=d;b.lv++;quest('upgrade');ov.style.display='none';render();save(true);navigator.vibrate?.(18);toast('تم التطوير إلى Lv '+b.lv)};ov.style.display='flex'}function cards(){$('drawer').innerHTML=Object.entries(TYPES).map(([k,d])=>`<button class="card" data-k="${k}"><b>${d.n}</b><small>🪙${d.c[0]} ⚙️${d.c[1]} ${d.c[2]?'💎'+d.c[2]:''}</small></button>`).join('');document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{st.selected=c.dataset.k;toast('اختر موقعاً في المدينة')})}map.addEventListener('pointerdown',e=>{if(e.target!==map)return;let r=map.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100,d=TYPES[st.selected];if(y<20||y>82||x<10||x>90)return;if(st.gold<d.c[0]||st.steam<d.c[1]||st.gems<d.c[2])return toast('الموارد غير كافية');st.gold-=d.c[0];st.steam-=d.c[1];st.gems-=d.c[2];st.b.push({id:Date.now(),t:st.selected,x,y,lv:1});quest('build');save(true);render();toast('تم بناء '+d.n)});$('buildBtn').onclick=()=>{$('drawer').classList.toggle('open');cards()};$('trainBtn').onclick=()=>{if(st.gold<140)return toast('تحتاج 140 ذهب');st.gold-=140;st.guards++;quest('train');save(true);render();navigator.vibrate?.(12);toast('انضم حارس جديد')};$('battleBtn').onclick=()=>{let chance=Math.min(92,58+power()/35);$('ovTitle').textContent='⚔ معقل الضباب';$('ovBody').innerHTML=`<p>قوة المملكة: <b>${power()}</b><br>فرصة النصر: <b>${Math.round(chance)}%</b><br>المكافأة: ذهب وبخار</p>`;$('ovAction').style.display='block';$('ovAction').textContent='بدء المعركة';$('ovAction').onclick=()=>{let win=Math.random()*100<chance;if(win){st.gold+=480;st.steam+=180;st.wins++;quest('battle');toast('🏆 انتصار')}else toast('صمد الخصم • طوّر مملكتك');ov.style.display='none';save(true);render()};ov.style.display='flex'};$('hqBtn').onclick=()=>{let h=st.b.find(b=>b.t==='hq');if(h)openBuilding(h)};$('heroBtn').onclick=()=>{$('ovTitle').textContent='♛ مجلس الأبطال';$('ovBody').innerHTML='<p>قوة الحرس الحالية: <b>'+st.guards*8+'</b><br>مسارات الأبطال والمعدات ستتوسع في النسخ القادمة.</p>';$('ovAction').style.display='none';ov.style.display='flex'};$('infoBtn').onclick=()=>{$('ovTitle').textContent='CROWNFALL v0.23 Android';$('ovBody').innerHTML='<p>نسخة Android للاختبار: وضع أفقي، حفظ محلي، بناء وتطوير وتدريب ومعارك. الهوية: ملكي + Victorian + Steampunk.</p>';$('ovAction').style.display='none';ov.style.display='flex'};$('saveBtn').onclick=()=>save();$('closeOv').onclick=()=>ov.style.display='none';$('start').onclick=()=>{$('splash').style.display='none';toast('CROWNFALL TEST 0.23')};setInterval(()=>{if(document.hidden)return;st.b.forEach(b=>{if(b.t==='mine')st.gold+=.6*b.lv;if(b.t==='pump')st.steam+=.5*b.lv});ui();save(true)},2000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save(true)});cards();render();
</script></body></html>
